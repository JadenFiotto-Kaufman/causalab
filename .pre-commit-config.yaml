repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
    # Block any committed file > 50 MB. --enforce-all so CI (which runs
    # `pre-commit run --all-files`) also catches large files that slip in
    # via merges or branches, not just locally-staged adds.
    - id: check-added-large-files
      args: [--maxkb=51200, --enforce-all]

- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.14.5
  hooks:
    # Run the linter.
    - id: ruff-check
      # include python and pyi files (no ipynb)
      types_or: [ python, pyi ]
      # autofix if possible
      args: [ --fix ]
    # Run the formatter.
    - id: ruff-format
      types_or: [ python, pyi ]

- repo: local
  hooks:
    # The Rust core (crates/). fmt only: it is instant and needs no build.
    # clippy and `cargo test` compile the workspace and run in the CI test job.
    - id: cargo-fmt
      name: cargo fmt --check
      entry: cargo fmt --all -- --check
      language: system
      files: \.rs$
      pass_filenames: false
