[package]
name = "fst-core"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
fst-cuda = { version = "0.1.0", path = "../fst-cuda" }
libc = "0.2.189"
memmap2 = "0.9.11"
rayon = "1.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip", "preserve_order"] }
thiserror = "2.0.20"
tracing = "0.1"

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3"
