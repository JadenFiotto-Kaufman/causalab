[package]
name = "fst-py"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "_core"
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
fst-core = { version = "0.1.0", path = "../fst-core" }
fst-cuda = { version = "0.1.0", path = "../fst-cuda" }
pyo3 = { version = "0.29.2", features = ["abi3-py310"] }
thiserror = "2.0.20"

[features]
# set by maturin (pyproject.toml); off for plain `cargo` builds so the
# workspace links and tests on a machine whose `python3` is not the target
extension-module = ["pyo3/extension-module"]

[dev-dependencies]
tempfile = "3"
